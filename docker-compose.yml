services:
  db:
    image: postgres:16-alpine
    container_name: online_shoppers_db
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-online_shoppers}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - ./db/schema.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-online_shoppers}"]
      interval: 5s
      retries: 10

volumes:
  pgdata:
